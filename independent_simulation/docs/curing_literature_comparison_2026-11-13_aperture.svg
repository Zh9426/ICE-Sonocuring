<circle cx="310" cy="319" r="6" fill="white" stroke="#b14e37" stroke-width="3"/><text x="310" y="294" text-anchor="middle" class="tick">Center32*</text>
<circle cx="450" cy="298" r="6" fill="#2269a5"/><text x="450" y="277" text-anchor="middle" class="tick">Center48</text>
<circle cx="590" cy="179" r="6" fill="#197b6a"/><text x="590" y="159" text-anchor="middle" class="tick">Odd/Even32</text>
