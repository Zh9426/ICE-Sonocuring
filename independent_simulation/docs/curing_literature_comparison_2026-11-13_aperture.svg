<line x1="100" y1="320" x2="720" y2="320" stroke="#ddd"/><line x1="100" y1="205" x2="720" y2="205" stroke="#ddd"/>
<text x="87" y="325" text-anchor="end" class="tick">16</text><text x="87" y="210" text-anchor="end" class="tick">18</text><text x="87" y="95" text-anchor="end" class="tick">20</text>
