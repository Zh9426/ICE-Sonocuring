<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 0 850 390">
<rect width="850" height="390" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#222}.tick{font-size:14px}.label{font-size:16px}.title{font-size:19px;font-weight:bold}</style>
<text x="425" y="28" text-anchor="middle" class="title">Target-box pressure-peak depth: existing simulation</text>
