<text x="170" y="344" text-anchor="middle" class="tick">2.06</text><text x="310" y="344" text-anchor="middle" class="tick">4.14</text><text x="450" y="344" text-anchor="middle" class="tick">6.22</text><text x="590" y="344" text-anchor="middle" class="tick">8.17</text><text x="675" y="344" text-anchor="middle" class="tick">8.30</text>
