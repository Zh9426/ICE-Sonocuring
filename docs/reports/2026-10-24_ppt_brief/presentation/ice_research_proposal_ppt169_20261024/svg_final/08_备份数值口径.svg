<g id="n08-interpretation" data-pptx-bounds="48 520 1184 126" font-size="20"><text x="48" y="544" fill="#C27B22">32元近源/浅层未通过proposed 5%场差诊断；全64元这些场差通过，但峰位检查未全通过。</text><text x="48" y="587" fill="#516176">场差为细网格插值到粗网格；两网格不等于完整收敛。测点实际坐标与边界对照见备注。</text><text x="48" y="630" fill="#142B45">Qp仅为压力平方时间积分代理；上述比值不是能量占比、全空间旁瓣或材料效率。</text></g>
