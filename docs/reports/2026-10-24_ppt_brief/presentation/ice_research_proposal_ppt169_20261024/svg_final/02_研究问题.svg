<g id="n02-title" data-pptx-bounds="48 28 1184 108"><text x="48" y="48" font-size="16" fill="#516176">研究目标  /  从愿景到可检验问题</text><text x="48" y="108" font-size="40" font-weight="bold" fill="#142B45">先回答三个可验证的问题</text></g>
<g id="n02-questions" data-pptx-bounds="46 169 1188 361">
<g id="n02-acoustics"><text x="48" y="196" font-size="22" fill="#516176">01</text><g id="n02-acoustic-stage" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="48 218 344 88" fill="#142B45" stroke="none"><path d="M 48 218 L 348 218 L 392 262 L 348 306 L 48 306 L 92 262 Z" /></g><text x="220" y="274" font-weight="bold" text-anchor="middle" fill="#FFFFFF">声学问题</text><text x="48" y="371" font-size="28" font-weight="bold" fill="#142B45">声场能否局部可控？</text><text fill="#516176" font-size="20" x="48" y="429">同时评价焦区聚集</text><text fill="#516176" font-size="20" x="48" y="463">与目标外暴露</text></g>
<g id="n02-materials"><text x="468" y="196" font-size="22" fill="#516176">02</text><g id="n02-material-stage" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="468 218 344 88" fill="#008C95" stroke="none"><path d="M 468 218 L 768 218 L 812 262 L 768 306 L 468 306 L 512 262 Z" /></g><text x="640" y="274" font-weight="bold" text-anchor="middle" fill="#FFFFFF">材料问题</text><text x="468" y="371" font-size="28" font-weight="bold" fill="#142B45">能否产生局部材料作用？</text><text fill="#516176" font-size="20" x="468" y="429">明确配方、标定</text><text fill="#516176" font-size="20" x="468" y="463">与可测材料判据</text></g>
<g id="n02-workflow"><text x="888" y="196" font-size="22" fill="#516176">03</text><g id="n02-process-stage" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="888 218 344 88" fill="#EFF3F7" stroke="#C27B22" stroke-width="1.5"><path d="M 888 218 L 1188 218 L 1232 262 L 1188 306 L 888 306 L 932 262 Z" /></g><text x="1060" y="274" font-weight="bold" text-anchor="middle" fill="#142B45">流程问题</text><text x="888" y="371" font-size="28" font-weight="bold" fill="#142B45">能否成线与双功能协同？</text><text fill="#516176" font-size="20" x="888" y="429">分别验证扫描、定位</text><text fill="#516176" font-size="20" x="888" y="463">及成像恢复</text></g>
<text x="48" y="518" font-size="20" fill="#C27B22">前一层证据，不能替代后一层验证。</text>
</g>
<g id="n02-principle" data-pptx-bounds="48 562 1184 94"><rect x="48" y="562" width="1184" height="94" fill="#EFF3F7" /><text x="72" y="600" font-size="20" fill="#516176">共同原则：目标与非目标一起评价</text><text x="72" y="639" font-size="28" font-weight="bold" fill="#142B45">用可重复的测量与对照，决定是否进入下一阶段。</text></g>
